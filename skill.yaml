name: Vulcan Mermaid
version: 0.1.3
enable: true
debug: false
registration:
  mode: implicit
  default_locale: en-US
  locales:
    en-US:
      title: "Vulcan Mermaid"
      description: "Browse, edit, validate, and export local Mermaid architecture documents."
    zh-CN:
      title: "Vulcan Mermaid"
      description: "浏览、编辑、校验和导出本地 Mermaid 架构文档。"
    zh-TW:
      title: "Vulcan Mermaid"
      description: "瀏覽、編輯、驗證及匯出本機 Mermaid 架構文件。"
  prompt_skills:
    - name: mermaid-workflow
      file: skills/mermaid-workflow/SKILL.md
      locales:
        en-US:
          title: "Mermaid architecture workflow"
          description: "Use for .omm workspaces, Mermaid validation and diffs, or offline HTML export."
        zh-CN:
          title: "Mermaid 架构文档指南"
          description: "介绍如何操作 .omm 工作区、校验和比较 Mermaid 图，以及离线导出 HTML。"
        zh-TW:
          title: "Mermaid 架構文件指南"
          description: "說明如何操作 .omm 工作區、驗證和比較 Mermaid 圖，以及離線匯出 HTML。"
entries:
  - name: workspace
    description: Manage local .omm architecture documents with one action-based tool. Optional host-injected PWD enables relative node paths; without PWD use absolute .omm paths. Supports init, tree, read, batch write, delete, validate, diff, refs and offline HTML export.
    lua_entry: runtime/workspace.lua
    lua_module: workspace
    input_schema:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        PWD:
          type: string
          description: Optional absolute existing project directory, normally injected invisibly by the host. Never inferred from cwd or environment. Omitted/empty PWD requires absolute path and writes[].path (including .omm); explicit text diff needs no PWD.
        action:
          type: string
          enum: [init, tree, read, write, delete, validate, diff, refs, export]
          description: init creates the workspace; tree/read browse; write updates fields in one batch; delete moves to trash; validate checks syntax/references; diff compares history or before/after; refs lists document links; export writes offline HTML. See the mermaid-workflow Skill for action-specific examples.
        path:
          type: string
          minLength: 1
          description: With PWD, a node key such as architecture/api or .omm/architecture/api; absolute paths also work. Without PWD, use /project/.omm[/node] or D:/project/.omm[/node]. read/delete/history diff require a node; init requires the .omm root; tree/validate/refs/export accept root or subtree, and may omit path only with PWD. Never pass diagram.mmd or a project directory here.
        writes:
          type: array
          minItems: 1
          maxItems: 100
          description: Required only for write. One entry per node; all entries must resolve to one workspace. Paths and fields are preflighted before writing; batches are not crash-atomic across files.
          items:
            type: object
            additionalProperties: false
            required: [path, fields]
            properties:
              path:
                type: string
                minLength: 1
                description: Node location below .omm. Relative with PWD, otherwise absolute including .omm. The .omm root cannot be written as a node.
              fields:
                type: object
                additionalProperties: false
                minProperties: 1
                properties:
                  description: {type: string, description: "Node overview"}
                  diagram: {type: string, description: "Architecture flowchart source"}
                  constraint: {type: string, description: "Design constraints"}
                  concern: {type: string, description: "Risks and concerns"}
                  context: {type: string, description: "Background and evidence"}
                  todo: {type: string, description: "Pending tasks"}
                  note: {type: string, description: "Additional notes"}
        before:
          type: string
          description: Previous source for filesystem-free diff; must be supplied together with after and without path. No PWD is needed.
        after:
          type: string
          description: Current source paired with before; both may be empty strings. History diff uses path instead.
        output:
          type: string
          minLength: 1
          description: Only for export. Omit for project/.omm-export/architecture.html. With PWD, a single .html filename is allowed; without PWD, an explicit output must be absolute. Absolute output must be a direct .html file under the selected project's .omm-export directory.
        recursive:
          type: boolean
          description: Required true to delete a node with children. Deletion moves it into .omm/.trash.
