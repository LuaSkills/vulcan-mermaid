<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Vulcan Mermaid · 离线架构查看器</title>
<style>
:root{color-scheme:dark;--bg:#11151d;--panel:#181e29;--surface:#202838;--line:#303b50;--ink:#e8edf8;--muted:#9daac2;--accent:#9bb8ff;--green:#92deb9;--amber:#f6ce84;--red:#f69ca5}
:root[data-theme=light]{color-scheme:light;--bg:#f4f6fc;--panel:#fff;--surface:#edf1fb;--line:#d8e0ef;--ink:#22304c;--muted:#5f7092;--accent:#305bb5;--green:#23754f;--amber:#885f16;--red:#b32c45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}header{height:68px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}.brand{font-weight:750;font-size:18px;letter-spacing:.3px}.brand b{color:var(--accent)}.tag{font:11px ui-monospace,monospace;border:1px solid var(--line);color:var(--green);border-radius:99px;padding:3px 9px}.spacer{flex:1}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:245px minmax(300px,1fr) 350px;height:calc(100vh - 100px)}nav{border-right:1px solid var(--line);overflow:auto;padding:20px 12px;background:var(--panel)}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin:0 9px 12px}#search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 11px;border-radius:7px;margin-bottom:14px}.tree-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;margin:3px 0;overflow-wrap:anywhere;font-size:13px}.tree-item.active{background:var(--surface);border-color:var(--line);color:var(--accent)}main{min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);gap:8px;min-height:70px}.toolbar h1{font-size:16px;margin:0;overflow-wrap:anywhere}.toolbar p{font-size:11px;margin:2px 0;color:var(--muted)}#graph-area{position:relative;flex:1;min-height:200px;background-image:radial-gradient(var(--line) .6px,transparent .6px);background-size:18px 18px;overflow:hidden}#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#graph.dragging{cursor:grabbing}#empty{position:absolute;inset:25% 10% auto;text-align:center;color:var(--muted);white-space:pre-wrap}.graph-node{cursor:pointer}.graph-node:focus{outline:none}.graph-node:focus .shape,.graph-node:hover .shape{stroke:var(--accent);stroke-width:3}.node-label{font:13px system-ui,"Microsoft YaHei",sans-serif;pointer-events:none}.edge-label{font:11px system-ui,"Microsoft YaHei",sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.legend{padding:9px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:15px}.legend strong{color:var(--green)}aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px}.tabs{display:flex;gap:5px;margin-bottom:18px}.tabs button{flex:1;font-size:12px}.tabs button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}#details h2{font-size:14px;color:var(--accent);margin-top:22px}#details h3{font-size:14px}#details p{overflow-wrap:anywhere}#details pre{font:12px/1.6 ui-monospace,Consolas,monospace;background:var(--bg);padding:12px;border:1px solid var(--line);border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere}#details ul{padding-left:20px}#details .ref{display:block;text-align:left;font-size:12px;margin:6px 0;max-width:100%;overflow-wrap:anywhere}.issue{font-size:12px;border-left:3px solid var(--amber);padding:7px 10px;margin:8px 0;background:var(--surface)}.issue.error{border-color:var(--red)}#status{height:32px;border-top:1px solid var(--line);padding:6px 16px;color:var(--muted);font:11px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#notice{padding:8px 18px;background:var(--surface);color:var(--amber);font-size:12px;display:none}@media(max-width:1100px){.shell{grid-template-columns:200px minmax(260px,1fr) 280px}header{padding:0 14px}#generated{display:none}}@media(max-width:760px){.shell{height:auto;grid-template-columns:1fr}nav{max-height:230px;border-right:0}main{height:65vh}aside{border-left:0;border-top:1px solid var(--line)}header{gap:9px}.brand{font-size:15px}.tag{font-size:9px}#status{position:sticky;bottom:0;background:var(--panel)}}
</style>
</head>
<body>
<header><span class="brand"><b>V</b> Vulcan Mermaid</span><span class="tag">OFFLINE SNAPSHOT</span><span class="spacer"></span><span id="generated" class="muted"></span><button id="theme" aria-label="切换明暗主题">明 / 暗</button></header>
<div class="shell"><nav aria-label="架构节点"><p class="eyebrow">WORKSPACE / 架构视角</p><input id="search" aria-label="搜索节点" placeholder="搜索名称或描述…"><div id="tree"></div></nav><main><div class="toolbar"><div><h1 id="title">架构工作区</h1><p id="subtitle">选择一个视角开始浏览</p></div><span class="spacer"></span><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应</button></div><div id="notice"></div><div id="graph-area"><svg id="graph" aria-label="架构图" role="img"></svg><div id="empty"></div></div><div class="legend"><span>拖动平移 · 滚轮缩放</span><span>点击节点查看下级</span><span><strong>绿色</strong>：新增或修改</span></div></main><aside><div class="tabs" role="tablist"><button data-tab="details" role="tab" aria-selected="true">说明</button><button data-tab="source" role="tab" aria-selected="false">源码</button><button data-tab="changes" role="tab" aria-selected="false">差异</button></div><div id="details"></div></aside></div>
<footer id="status">正在读取嵌入的工作区…</footer>
<script id="snapshot" type="application/json">VULCAN_SNAPSHOT_JSON</script>
<script>/* VULCAN_VENDOR */</script>
<script>/* VULCAN_APP */</script>
</body></html>
